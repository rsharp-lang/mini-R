<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Monaco Editor</title>
    <link rel="stylesheet" data-name="vs/editor/editor.main"
          href="/editor/editor.main.css">
    <style>
        html, body, #container {
            width: 100%;
            height: 100%;
            margin: 0;
            padding: 0;
            overflow: hidden;
        }

        #container {
            display: flex;
        }
    </style>
</head>
<body>
    <div id="container"></div>
    <script src="/loader.js"></script>
    <script>
        require.config({ paths: { 'vs': '/' } });

        // 解决 CDN 加载 Monaco 的 Web Worker 跨域问题
        window.MonacoEnvironment = {
            getWorkerUrl: function (workerId, label) {
                return `data:text/javascript;base64,${btoa(
                    "self.MonacoEnvironment = { baseUrl: '/' }; " +
                    "importScripts('/base/worker/workerMain.js')"
                )}`;
            }
        };

        require(['vs/editor/editor.main'], function () {
            // 创建编辑器实例
            window.editor = monaco.editor.create(document.getElementById('container'), {
                value: "",
                language: 'plaintext',
                automaticLayout: true  // 自动适应容器大小
            });

            // 向 WinForm 宿主发送"初始化完成"消息
            window.chrome.webview.postMessage('initialized');
        });

        // C# 调用：设置编辑器内容
        window.setEditorContent = function (content, language) {
            window.editor.setValue(content);
            if (language) {
                monaco.editor.setModelLanguage(window.editor.getModel(), language);
            }
        };

        // C# 调用：获取编辑器内容
        window.getEditorContent = function () {
            return window.editor.getValue();
        };
    </script>
</body>
</html>
